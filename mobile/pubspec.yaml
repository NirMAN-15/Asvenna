name: asvanna_mobile
description: "ASVANNA - Cross-platform Farmer & Buyer Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  provider: ^6.1.2
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  geolocator: ^12.0.0
  google_maps_flutter: ^2.6.0
  firebase_core: ^2.32.0
  firebase_messaging: ^14.9.4
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/images/
